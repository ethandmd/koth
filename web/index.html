<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King of the Hill TD</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0b;
      }
      body {
        font-family: "Press Start 2P", "Courier New", monospace;
      }
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        color: #f5f5f5;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.65);
        pointer-events: none;
        user-select: none;
        padding: 6px 8px;
        position: fixed;
      }
      #hud::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.35) 0px,
          rgba(0, 0, 0, 0.35) 1px,
          rgba(0, 0, 0, 0.0) 2px,
          rgba(0, 0, 0, 0.0) 4px
        );
        mix-blend-mode: multiply;
        opacity: 0.7;
        pointer-events: none;
      }
      #status {
        margin-left: 12px;
        color: #ff6b6b;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      Score: <span id="score">0</span>
      <span aria-hidden="true"> | </span>
      Wall: <span id="wall">100%</span>
      <span id="status"></span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
